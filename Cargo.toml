[package]
name = "project-rts"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- Bevy 0.18 (from GitHub main branch) ---
bevy = { git = "https://github.com/bevyengine/bevy", branch = "main", default-features = true, features = [
  "bevy_asset",
  "bevy_audio",
  "bevy_pbr",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_winit",
  "png",
  "x11"
] }

# --- Keep bevy_mesh in sync with Bevy itself ---
bevy_mesh = { git = "https://github.com/bevyengine/bevy", branch = "main" }

futures-lite = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
