name: Release
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/project-rts${{ matrix.ext }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target wasm32-unknown-unknown
      - name: Package web build
        run: |
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/project-rts.wasm dist/
          cp wasm/index.html wasm/restart-audio-context.js dist/
          cd dist && zip -r project-rts-wasm.zip .
      - name: Upload WASM assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/project-rts-wasm.zip
